[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "airflow-spawn"
version = "0.3.0"
description = "Apache Airflow operator that runs a task on an ephemeral EC2 instance via spore-host/spawn"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "scttfrdmn" }]
keywords = ["airflow", "aws", "ec2", "spawn", "operator", "workflow", "ephemeral"]
dependencies = [
    # Operator/Trigger/defer + conf are stable public API across the 2->3
    # transition; only the Executor interface churned (which we deliberately
    # don't touch). Import BaseOperator from airflow.sdk (3.x) with a 2.x fallback.
    "apache-airflow>=2.9,<4",
]

[project.optional-dependencies]
# ruff is capped below 0.16: that release moved a large set of opinionated rules
# (BLE, PLW, TRY, C408, EXE, B017, …) into the DEFAULT rule set, so an unpinned
# `ruff check .` silently changes what CI enforces whenever ruff publishes — the
# lint here went red with no code change on our side. Same cap as
# snakemake-executor-plugin-spawn. Raising it is a deliberate change: pick the
# rules to adopt via an explicit `[tool.ruff.lint] select`, don't inherit them.
# `pyyaml` is a test-only dependency: tests/test_ci_hygiene.py parses
# .github/dependabot.yml. It is imported unguarded there on purpose — a
# try/except import degrades to a skip, and a skipped wiring test reports green
# while asserting nothing.
dev = ["pytest>=7", "pytest-asyncio>=0.23", "ruff>=0.5,<0.16", "mypy>=1.8", "pyyaml>=6"]

[project.urls]
Homepage = "https://github.com/spore-host/airflow-spawn"
Issues = "https://github.com/spore-host/spore-host/issues"

# Airflow discovers operators/triggers by IMPORT PATH, not entry points, and we
# expose no custom connection type — so this is a plain package, NOT an
# apache-airflow-providers-* provider. No [project.entry-points] needed.

[tool.setuptools.packages.find]
include = ["airflow_spawn*"]

[tool.ruff]
line-length = 100
target-version = "py310"

# The engine-composition test is NOT a unit test: it is a standalone script that
# needs a live Substrate emulator, the `spawn`/`aws` CLIs on PATH, and
# AWS_ENDPOINT_URL, and it is driven by the composition-test workflow (which runs
# it directly, not through pytest). But it is named `composition_test.py`, which
# matches pytest's default `*_test.py` discovery, so a bare `pytest -q` collects
# it and dies at import on `os.environ["AWS_ENDPOINT_URL"]` — a collection ERROR,
# which fails the whole run rather than skipping one test. Restricting discovery
# to the unit-test files keeps `pytest -q` (what CI runs) honest. The sibling
# repos avoid this by naming theirs `composition-test.sh`.
[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["tests/composition"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
